<!doctype html>
<html lang="fr" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta
      name="description"
      content="Dictadapt — outil d'aide à la dictée pour les élèves en difficulté. Photo, OCR, découpage en petites parties, écoute illimitée. Fonctionne hors ligne, sans compte."
    />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Dictadapt</title>
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      try {
        var stored = localStorage.getItem('dictadapt-theme');
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {
        /* private mode — fall back to light */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
